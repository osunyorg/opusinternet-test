    data:

      elements:
        - 
          title: >-
            Pourquoi faire appel à un Directeur de projet indépendant plutôt qu’à une agence ?
          description: >-
            <p>Vous bénéficiez d'un interlocuteur unique avec 20 ans d'expérience, d'une grande réactivité, de coûts maîtrisés sans frais de structure d'agence, et d'un accompagnement sur-mesure axé sur vos besoins réels.</p>
        - 
          title: >-
            Qu'apporte ma prestation d'accompagnement ?
          description: >-
            <p>Un pilotage global, rigoureux et serein. Au-delà des aspects techniques ou graphiques, je garantis la cohérence éditoriale, le respect du calendrier, la qualité des livrables et une coordination fluide entre toutes les parties prenantes (prestataires, équipes internes).</p>
        - 
          title: >-
            Est-ce que j'interviens uniquement à Agen ?
          description: >-
            <p>Non. Je suis basé à Layrac / Agen et j'interviens facilement en présentiel dans tout le Lot-et-Garonne, en Nouvelle-Aquitaine et en Occitanie. La majorité des projets de direction de projet web, d'audit et de rédaction se gèrent également très efficacement à distance, partout en France.</p>
        - 
          title: >-
            Comment sont calculés mes tarifs ?
          description: >-
            <p>Chaque projet étant réalisé sur mesure, je travaille principalement au forfait (établi après une première phase de cadrage) ou au TJM (taux journalier moyen). Un devis détaillé vous est toujours remis avant tout engagement. Pour le webmastering et l'animation éditoriale régulière, nous définissons ensemble un forfait mensuel adapté à vos besoins.</p>
        - 
          title: >-
            Mon site actuel a plusieurs années, faut-il tout refondre ?
          description: >-
            <p>Pas nécessairement ! Nous commençons par un audit ergonomique et éditorial. Parfois, une restructuration des contenus, une réécriture ciblée et une optimisation de l'existant suffisent à redonner toute son efficacité à votre site.</p>
        - 
          title: >-
            Qu'est-ce qu'un CMS éco-conçu comme Osuny ?
          description: >-
            <p>C'est une plateforme pensée pour réduire l'empreinte carbone du web, garantir une vitesse de chargement optimale et assurer une conformité exemplaire avec les normes d'accessibilité numérique (RGAA).</p>



