    data:

      elements:
        - 
          title: >-
            Qu'apporte ma prestation d'accompagnement ?
          description: >-
            <p>Un pilotage global et serein. Au-delà des aspects purement techniques ou graphiques, je garantis la cohérence éditoriale, le respect du calendrier, la qualité des livrables et la coordination fluide entre toutes les parties prenantes.</p>
        - 
          title: >-
            Comment sont calculés mes tarifs ?
          description: >-
            <p>Chaque projet étant sur-mesure, je travaille principalement au forfait (établi après une première phase de cadrage) ou au TJM (taux journalier moyen). Un devis détaillé vous est toujours remis avant tout engagement. Pour l'animation éditoriale régulière, nous définissons ensemble un forfait mensuel adapté à vos besoins.</p>
        - 
          title: >-
            Est-ce que vous êtes propriétaire de votre site ?
          description: >-
            <p>Vos contenus vous appartiennent à 100 %. L'ensemble des textes, médias, données et architectures créés pour vous restent votre propriété exclusive. Concernant la plateforme et l'infrastructure technique, une redevance annuelle de TMA (Tierce Maintenance Applicative) assure la prise en charge de l'hébergement, des mises à jour de sécurité et du maintien en condition opérationnelle de votre site.</p>
        - 
          title: >-
            Est-ce que j'interviens uniquement à Agen ?
          description: >-
            <p>Je suis basé à Agen et j'interviens facilement dans tout le Lot-et-Garonne et en Nouvelle-Aquitaine et Midi-Pyrénées, mais la majorité des projets de direction de projet et de rédaction se gère très efficacement à distance, partout en France.</p>
        - 
          title: >-
            Qu'est-ce qu'un CMS éco-conçu comme Osuny ?
          description: >-
            <p>C'est une plateforme pensée pour réduire l'empreinte carbone du web, garantir une vitesse de chargement optimale et assurer une conformité exemplaire avec les normes d'accessibilité numérique (RGAA).</p>



